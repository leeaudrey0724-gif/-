var $=function(id){return document.getElementById(id)};

function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&Array.isArray(d.items)){items=d.items;order=(d.order||[]).filter(function(id){return items.some(function(i){return i.id===id})})}}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items,order:order}))}catch(e){say("無法儲存到瀏覽器，請使用匯出備份")}}
function say(t){$("msg").textContent=t;setTimeout(function(){$("msg").textContent=""},3500)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function sec(cls,label,txt){return txt?'<div class="sec '+cls+'"><b>'+label+'</b>'+'<div>'+esc(txt)+'</div>'+'</div>':""}
function chips(t){if(!t)return "";return '<div class="sec course"><b>課程</b><div class="chips">'+t.split(/[、。]/).filter(Boolean).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div></div>'}
function sal(t){if(!t)return "";var r='',n='';t.split('\n').forEach(function(l){var m=l.match(/^(第 [^：]+)：(.*)$/);if(m)r+='<div class="yr"><span>'+esc(m[1])+'</span><span>'+esc(m[2])+'</span></div>';else n+='<div class="nt">'+esc(l)+'</div>'});return '<div class="sec sal"><b>薪資</b><div>'+r+n+'</div></div>'}
function score(it){return it.hi?'<div class="score">114 寒轉　最高 '+it.hi+'　最低 '+it.lo+'</div>':'<div class="score">114 寒轉分數：未提供</div>'}
function card(it,rank){
  var h='<div class="card" data-id="'+it.id+'"><div class="head">';
  if(rank)h+='<div class="rank">'+rank+'</div>';
  h+='<div><div class="title">'+esc(it.dept)+'</div>'+(rank?'':'<div class="dept">'+esc(it.school)+'</div>')+score(it)+'</div>'+(rank?'<div class="grip" title="拖曳排序"><i></i></div>':'')+'</div>';
  if(!rank){var op=openIds[it.id];h+='<button class="tg'+(op?' on':'')+'" data-a="tg" data-id="'+it.id+'" aria-expanded="'+(op?'true':'false')+'"><span>教學內容・課程・未來方向・薪資</span><span class="ar"></span></button><div class="fold'+(op?' open':'')+'"><div class="fi">'+sec("intro","教學內容",it.intro)+chips(it.courses)+sec("job","未來方向",it.job)+sal(it.salary)+'</div></div>'}
  h+='<div class="btns">';
  if(rank){
    var i=rank-1;
    h+='<button data-a="up" data-id="'+it.id+'"'+(i===0?" disabled":"")+'>↑ 上移</button>';
    h+='<button data-a="down" data-id="'+it.id+'"'+(i===order.length-1?" disabled":"")+'>↓ 下移</button>';
    h+='<button data-a="out" data-id="'+it.id+'">移出志願序</button>';
  }else{
    var oi=order.indexOf(it.id);h+=oi<0?'<button class="primary" data-a="in" data-id="'+it.id+'">加入志願序</button>':'<button data-a="out" data-id="'+it.id+'">✓ 已加入第 '+(oi+1)+' 志願（點此移出）</button>';
  }
  h+='</div></div>';
  return h;
}
function render(){
  var byId={};items.forEach(function(i){byId[i.id]=i});
  var pool=items.slice().sort(function(a,b){var x=parseFloat(a.hi),y=parseFloat(b.hi);x=isNaN(x)?-1:x;y=isNaN(y)?-1:y;return y-x||(parseFloat(b.lo)||0)-(parseFloat(a.lo)||0)});
  $("pool").innerHTML=pool.length?pool.map(function(i){return card(i,0)}).join(""):'<div class="empty">還沒有候選志願，請按最下方的「載入中國醫藥大學 12 系」</div>';
  $("ranked").innerHTML=order.length?order.map(function(id,n){return card(byId[id],n+1)}).join(""):'<div class="empty">按候選志願的「加入志願序」，排好後可拖曳右側的 ═ 調整順序</div>';
  $("c1").textContent=pool.length+" 個";$("c2").textContent=order.length+" 個";
}


document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var id=b.dataset.id,a=b.dataset.a,i=order.indexOf(id);
  if(a==="tg"){var f=b.nextElementSibling,op2=f.classList.toggle("open");b.classList.toggle("on",op2);b.setAttribute("aria-expanded",op2);if(op2)openIds[id]=1;else delete openIds[id];return}
  if(a==="in")order.push(id);
  else if(a==="out")order.splice(i,1);
  else if(a==="up"&&i>0){order[i]=order[i-1];order[i-1]=id}
  else if(a==="down"&&i>-1&&i<order.length-1){order[i]=order[i+1];order[i+1]=id}
  else if(a==="del"){if(!confirm("確定刪除這個志願？"))return;items=items.filter(function(x){return x.id!==id});order=order.filter(function(x){return x!==id})}
  save();render();
});

$("exp").onclick=function(){
  var s=JSON.stringify({items:items,order:order});
  $("box").hidden=false;$("box").value=s;$("box").select();
  try{navigator.clipboard.writeText(s).then(function(){say("已複製備份內容")},function(){say("請手動複製下方文字")})}catch(e){say("請手動複製下方文字")}
};
$("imp").onclick=function(){
  if($("box").hidden){$("box").hidden=false;$("box").value="";say("請貼上備份內容，再按一次匯入");return}
  try{
    var d=JSON.parse($("box").value);
    if(!d||!Array.isArray(d.items))throw 0;
    if(!confirm("匯入會覆蓋目前的資料，確定嗎？"))return;
    items=d.items;order=(d.order||[]).filter(function(id){return items.some(function(i){return i.id===id})});
    save();render();$("box").hidden=true;say("匯入完成");
  }catch(e){say("備份內容格式不正確")}
};
$("seed").onclick=function(){seed();say("已載入，已存在的不會重複")};

var first=true;try{first=localStorage.getItem(KEY)===null}catch(e){}
load();if(first){seed()}else{patch();render()}
try{if(window.Sortable)Sortable.create($("ranked"),{draggable:".card",handle:".grip",animation:150,ghostClass:"sortable-ghost",onUpdate:function(){var ids=[].map.call($("ranked").querySelectorAll(".card"),function(c){return c.dataset.id});if(ids.length===order.length){order=ids;save()}setTimeout(render,0)}})}catch(e){}
})();
</script>
</body>
</html>
